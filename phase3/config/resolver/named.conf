options {
    directory "/var/cache/bind";
    recursion yes;
    dnssec-validation yes;
    listen-on { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    allow-recursion { 172.16.0.0/16; 127.0.0.1; };
};

include "/signed/root-anchor.conf";

zone "." {
    type hint;
    file "/etc/bind/db.root.hints";
};