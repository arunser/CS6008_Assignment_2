tls rogue-tls {
    cert-file "/pki/rogue.crt";
    key-file  "/pki/rogue.key";
};
options {
    directory "/var/cache/bind";
    recursion no;
    dnssec-validation no;
    listen-on port 853 tls rogue-tls { any; };
    listen-on-v6 { none; };
    allow-query { any; };
};
zone "example.com" { type master; file "/etc/bind/db.rogue"; };
